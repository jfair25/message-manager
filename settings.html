<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Message Manager Settings</title>
    <!-- Links to the custom CSS layout variables -->
    <link rel="stylesheet" href="settings.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- ========================================== -->
        <!-- LEFT SIDEBAR CONTROL CORES                 -->
        <!-- ========================================== -->
        <aside class="dashboard-sidebar">
            <div class="brand-header">
                <h2>Message Manager</h2>
                <span class="sub-heading">Configuration Console</span>
            </div>

            <!-- Panel View Selection Navigation Tabs -->
            <div class="tab-container">
                <button type="button" id="tab-btn-cats">📁 Categories</button>
                <button type="button" id="tab-btn-msgs">✉ Messages</button>
                <button type="button" id="tab-btn-locs">📍 Locations</button>
            </div>

            <!-- Categories Selection Wrapper -->
            <div id="settings-panel-cats" class="panel-view-wrapper" style="display: none;">
                <div class="section-header">
                    <label>Categories Grid</label>
                    <button type="button" id="modal-cat-create-btn">➕ Add</button>
                </div>
                <!-- Custom list block supporting native drag re-ordering -->
                <div id="custom-cat-list" class="custom-drag-list"></div>
            </div>

            <!-- Message Templates Selection Wrapper -->
            <div id="settings-panel-msgs" class="panel-view-wrapper" style="display: flex;">
                <div class="section-header">
                    <label>Message Cards</label>
                    <button type="button" id="modal-create-btn">➕ Add</button>
                </div>
                <!-- Custom list block supporting native drag re-ordering -->
                <div id="custom-msg-list" class="custom-drag-list"></div>
            </div>

            <!-- Locations Selection Wrapper -->
            <div id="settings-panel-locs" class="panel-view-wrapper" style="display: none;">
                <div class="section-header">
                    <label>Locations Map</label>
                    <button type="button" id="modal-loc-create-btn">➕ Add</button>
                </div>
                <!-- Custom list block supporting native drag re-ordering -->
                <div id="custom-loc-list" class="custom-drag-list"></div>
            </div>

            <!-- Backup & Restore Operations Group -->
            <div class="backup-section">
                <button type="button" id="export-json-btn">📤 Export Backup</button>
                <button type="button" id="import-json-btn">📥 Upload JSON</button>
                <input type="file" id="hidden-file-picker" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- ========================================== -->
        <!-- RIGHT EDITING FORM BODY                    -->
        <!-- ========================================== -->
        <main class="dashboard-main">
            <!-- Dynamic Insertion Form Panels -->
            <div id="form-scroll-container">
                <!-- Live Categories Form Formats -->
                <div id="modal-cat-editor-fields" style="display: none;"></div>

                <!-- Live Message Card Template Fields -->
                <div id="modal-editor-fields" style="display: block;"></div>

                <!-- Live Locations Map Configurations -->
                <div id="modal-loc-editor-fields" style="display: none;"></div>
            </div>

            <!-- Global Layout Action Control Footer -->
            <footer class="settings-footer">
                <button type="button" id="modal-cancel-btn">Cancel</button>
                <button type="button" id="modal-save-btn">Save Changes</button>
            </footer>
        </main>
    </div>

    <!-- Attach Extension Runtime Main Controller JavaScript -->
    <script type="module" src="settings.js"></script>
</body>
</html>
