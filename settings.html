<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Message Manager Settings</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #282d3a;
            overflow-y: auto !important;
        }
        #settings-panel-msgs, #settings-panel-locs {
            width: 100%;
        }
    </style>
</head>
<body style="background-color: #282d3a; color: #f9fafb; padding: 20px;">
    <!-- Segments and Global JSON File Operations Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e222b; padding: 6px; border-radius: 8px; border: 1px solid #374151; gap: 12px;">
        <div style="display: flex; gap: 8px; flex: 1;">
            <button type="button" id="tab-btn-msgs" style="height: 32px; font-size: 12px; font-weight: 600; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; width: 140px;">✉️ Messages</button>
            <button type="button" id="tab-btn-locs" style="height: 32px; font-size: 12px; font-weight: 600; background: transparent; color: #9ca3af; border: none; border-radius: 6px; cursor: pointer; width: 140px;">📍 Locations</button>
        </div>
        <div style="display: flex; gap: 6px;">
            <button type="button" id="export-json-btn" style="background-color: #4b5563; border: 1px solid #6b7280; color: white; font-size: 11px; font-weight: 600; padding: 0 12px; border-radius: 6px; height: 32px; width: auto;">📤 Export Backup</button>
            <button type="button" id="import-json-btn" style="background-color: #4b5563; border: 1px solid #6b7280; color: white; font-size: 11px; font-weight: 600; padding: 0 12px; border-radius: 6px; height: 32px; width: auto;">📥 Upload JSON</button>
            <input type="file" id="hidden-file-picker" accept=".json" style="display: none !important;">
        </div>
    </div>

    <!-- MESSAGES MANAGEMENT TAB PANEL CONTENT MODULE -->
    <div id="settings-panel-msgs">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 16px;">
            <span style="font-weight: 700; font-size: 14px; color: #ffffff;">Message Card Configurations</span>
            <button type="button" id="modal-create-btn" style="background-color:#10b981; border:none; color:#ffffff; font-size:11px; font-weight:700; padding:6px 12px; border-radius:6px; width:auto; height:28px;">➕ Add Card</button>
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display:block; font-size:11px; font-weight:700; text-transform:uppercase; margin-bottom:6px; color:#9ca3af;">Select Message Row to Modify</label>
            <select id="modal-msg-selector" style="width:100%; padding:10px; font-size:13px; border-radius:8px; border:1px solid #374151; background-color:#1e222b; color:#fff; outline:none;"></select>
        </div>
        <div id="modal-editor-fields" style="background:#1e222b; padding:16px; border-radius:10px; border:1px solid #374151; margin-bottom:16px;"></div>
    </div>

    <!-- GEOGRAPHIC LOCATIONS TAB PANEL CONTENT MODULE -->
    <div id="settings-panel-locs" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 16px;">
            <span style="font-weight: 700; font-size: 14px; color: #ffffff;">Location Map Reference Markers</span>
            <button type="button" id="modal-loc-create-btn" style="background-color:#10b981; border:none; color:#ffffff; font-size:11px; font-weight:700; padding:6px 12px; border-radius:6px; width:auto; height:28px;">➕ Add Location</button>
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display:block; font-size:11px; font-weight:700; text-transform:uppercase; margin-bottom:6px; color:#9ca3af;">Select Location Row to Modify</label>
            <select id="modal-loc-selector" style="width:100%; padding:10px; font-size:13px; border-radius:8px; border:1px solid #374151; background-color:#1e222b; color:#fff; outline:none;"></select>
        </div>
        <div id="modal-loc-editor-fields" style="background:#1e222b; padding:16px; border-radius:10px; border:1px solid #374151; margin-bottom:16px;"></div>
    </div>

    <div style="display: flex; gap: 10px; justify-content: flex-end; padding-top: 14px; border-top: 1px solid #374151; margin-top: 20px;">
        <button id="modal-cancel-btn" style="padding: 0 16px; width:auto; height: 36px; font-size: 12px; font-weight:600; border: 1px solid #374151; background: transparent; color:#9ca3af; border-radius: 6px;">Close</button>
        <button id="modal-save-btn" style="padding: 0 16px; width:auto; height: 36px; font-size: 12px; font-weight:600; border: none; background: #4f46e5; color: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(79,70,229,0.3);">Save Changes</button>
    </div>

    <script type="module" src="settings.js"></script>
</body>
</html>
