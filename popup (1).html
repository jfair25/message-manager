<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Top Navigation Header with Brand Logo -->
  <div id="top-nav-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <!-- Extension Brand Icon Alignment -->
      <img src="icons/icon32.png" alt="Icon" style="width: 24px; height: 24px; object-fit: contain;">
      <h1 style="font-size: 16px; font-weight: 700; margin: 0; color: var(--text-primary);">Message Manager</h1>
    </div>
    
    <!-- Operational Overlay Configuration Controller Trigger Button -->
    <button type="button" id="menu-dots-btn" aria-label="Open Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </button>
  </div>

  <!-- Dynamic Segment Navigation Hierarchy Controls -->
  <div id="back" hidden>
    <button type="button" class="backBtn">
      <svg viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Back
    </button>
  </div>

  <!-- Dynamic Primary View Containers -->
  <main id="extension-content">
    <!-- Step 1: Initial Message Macro Array Selection Options Matrix -->
    <div id="msg-buttons"></div>

    <!-- Step 2: Conditional Geographic Station Assignment Matrix -->
    <div id="geo-buttons" hidden></div>

    <!-- Step 3: Interactive Dynamic Form Configuration Variables Form HUD -->
    <div id="misc-fields" hidden>
      <div id="ldap" class="input-wrapper" hidden>
        <label for="ldap-input" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Driver LDAP</label>
        <input type="text" id="ldap-input" placeholder="e.g. jdoe">
      </div>
      
      <div id="car" class="input-wrapper" hidden>
        <label for="car-input" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Vehicle Number</label>
        <input type="text" id="car-input" placeholder="e.g. 4023">
      </div>
      
      <div id="charge" class="input-wrapper" hidden>
        <label for="charge-input" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Battery Charge %</label>
        <input type="number" id="charge-input" min="0" max="100" placeholder="e.g. 85">
      </div>

      <!-- Final Clip Extraction & Clipboard Pipeline Core Call to Action -->
        <div class="input-wrapper" style="margin-bottom: 12px;">
    <button type="button" id="extractBtn" style="background-color: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); font-weight: 600; height: 36px;">
        📋 Extract Clipboard Data
    </button>
</div>

      <button type="button" id="copyBtn">Copy</button>
    </div>

  <!-- Application Execution Mounting Gateway -->
  <script type="module" src="popup.js"></script>
</body>
</html>
