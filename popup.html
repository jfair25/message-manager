<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Top Navigation Controls Wrapper -->
  <div id="top-nav-header">
    <div id="back" hidden>
      <button class="backBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
      </button>
    </div>
    <button id="menu-dots-btn" type="button">⚙️</button>
  </div>

  <!-- ======================================================== -->
  <!-- STEP 1: CATEGORIES ROW TRAY (Loads Visible)              -->
  <!-- ======================================================== -->
  <div id="category-container">
    <div style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; margin-bottom: 10px; font-weight: 700;">
    </div>
    <div id="category-buttons"></div> <!-- Keep this container free of conflicting class tags -->
  </div>


  <!-- ======================================================== -->
  <!-- STEP 2: MESSAGES MATRIX (Starts Hidden)                  -->
  <!-- ======================================================== -->
  <div id="msg-buttons" hidden></div>

  <!-- ======================================================== -->
  <!-- STEP 3: GEOGRAPHIC MATRIX (Starts Hidden)                -->
  <!-- ======================================================== -->
  <div id="geo-buttons" hidden></div>

  <!-- ======================================================== -->
  <!-- STEP 4: CONDITIONAL TEXT INPUTS (Starts Hidden)          -->
  <!-- ======================================================== -->
  <div id="misc-fields" hidden>
    <div class="input-wrapper" id="car" hidden><label>Car #</label><input type="text"></div>
    <div class="input-wrapper" id="charge" hidden><label>Charge %</label><input type="text"></div>
    <div class="input-wrapper" id="ldap" hidden><label>Driver LDAP</label><input type="text"></div>
    <button id="copyBtn" type="button">Copy</button>
  </div>

  <div id="message" hidden style="margin-top: 10px; text-align: center; font-size: 12px; color: #10b981;"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
